<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="assets/css/Verification3.Css">
</head> 
<body>
    <div class="outerbox">
        <header class="logo" role="banner" aria-label="Company logo">
            <p><img src="Images/Logo.png" alt="Company logo"> FIN.exe</p>
        </header>

        <main class="innerbox">
            <aside class="image-box">
            </aside>

             <section class="verification-container" aria-labelledby="verification-heading">
                <h2 id="verification-heading" class="verification-context">OTP Verification</h2>
                <p class="verification-text"> We will send you a one time pin to your mobile number</p>
                <br>
                <br>
                <br>
                <p class="verification-text">Enter the code below to confirm</b></p>

                <form class="input-container">
                    <div class="phone-input" role="group" aria-label="Mobile number input">
                        <input inputmode="numeric" pattern="[0-9]*" type="text" maxlength="10" class="phone-input" name="phone" aria-label="mobile number" placeholder="Enter mobile number">
                    </div>

                    <div class="code-actions">
                        <button type="submit" class="next">Next</button>
                    </div>
                </form>

            </section>
            
        </main>

    </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="assets/css/SignUp.Css">
</head>
<body>
    <div class="outerbox">
        <header class="logo" role="banner" aria-label="Company logo">
            <p><img src="Images/Logo.png" alt="Company logo"> FIN.exe</p>
        </header>

        <main class="innerbox">
            <section class="signup-container" aria-labelledby="signup-heading">
                <h2 id="signup-heading" class="signup-context">Create an Account</h2>
                <p class="signup-text">Please enter your information to create an account</p>
                <br>
                <form action="/signup" method="post">
                    <label for="username">User Account</label>
                    <input type="text" id="username" name="username" required>

                    <div class="name-row">
                        <div class="field">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="field">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>

                    <button type="submit">Sign Up</button>
                    <p class="signup">Already have an account? <a href="LogIn.html">Log in</a></p>
                </form>
            </section>

            <aside class="image-box">
            </aside>
        </main>

    </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="assets/Css/Verification1.Css">
</head> 
<body>
    <div class="outerbox">
        <header class="logo" role="banner" aria-label="Company logo">
            <p><img src="Images/Logo.png" alt="Company logo"> FIN.exe</p>
        </header>

        <main class="innerbox">
            <aside class="image-box">
            </aside>

             <section class="verification-container" aria-labelledby="verification-heading">
                <h2 id="verification-heading" class="verification-context">Verification</h2>
                <p class="verification-text">Choose how you'd like to verify yourself</p>
                <br>
                <form action="/login" method="post">
                  <button type="submit">Email
                    <p class="verification-label">Jane.doe@gmail.com</p>
                  </button>
                  <button type="submit">Phone 
                     <p class="verification-label">Jane.doe@gmail.com</p>
                  </button>
                </form>
            </section>
        </main>

    </div>
</body>
</html>

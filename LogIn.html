<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="assets/css/Login.css">
</head>
<body>
    <div class="outerbox">
        <header class="logo" role="banner" aria-label="Company logo">
            <p><img src="Images/Logo.png" alt="logo"> FIN.exe</p>
        </header>

        <main class="innerbox">
            <section class="login-container" aria-labelledby="login-heading">
                <h2 id="login-heading" class="login-context">Welcome Back!</h2>
                <p class="login-text">Please enter your account details</p>
                <br>
                <form action="/login" method="post">
                    <label for="username">User Account</label>
                    <input type="text" id="username" name="username" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <p class="forgot"><a href="#">Forgot password?</a></p>

                    <button type="submit">Log In</button>
                     <p class="signup">Don't have an account? <a href="SignUp.html">Sign up</a></p>
                </form>
            </section>

            <aside class="image-box">
            </aside>
        </main>

    </div>
</body>
</html>
